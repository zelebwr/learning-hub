# This file defines the rules for automatically labeling pull requests.
# The format uses 'any' or 'all' to group file paths.

documentation:
  - any: ['README.md', 'CONTRIBUTING.md', 'WORKFLOWS.md', 'HOW_TO_USE_TEMPLATES.md']

workflow:
  - any: ['.github/workflows/*']

roadmap:
  - any: ['learning-roadmaps/*']

resource:
  - any: ['resources/*']